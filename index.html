<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RunningMate - 스마트 러닝 파트너</title>
  
  <script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=3f7a78903a6bb6af7151dd55db43ce26&libraries=services"></script>

  <style>
    :root {
      --primary-color: #4a6785;
      --primary-hover: #37506d;
      --bg-color: #f1f5f9;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-sub: #475569;
      --border-color: #cbd5e1;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    
    body { background-color: var(--bg-color); color: var(--text-main); display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 40px 20px; }
    header { text-align: center; margin-bottom: 32px; }
    header h1 { color: var(--primary-color); font-size: 2.5rem; margin-bottom: 8px; font-weight: 800; }
    header p { color: var(--text-sub); font-size: 1.1rem; }

    .container { width: 100%; max-width: 1024px; background: var(--card-bg); border-radius: 20px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08); border: 1px solid var(--border-color); overflow: hidden; }

    .tabs { display: flex; border-bottom: 1px solid var(--border-color); background-color: #f8fafc; }
    .tab-btn { flex: 1; padding: 18px 12px; border: none; background: none; font-weight: 700; font-size: 1.05rem; color: var(--text-sub); cursor: pointer; transition: all 0.2s; }
    .tab-btn.active { color: var(--primary-color); background-color: var(--card-bg); border-bottom: 4px solid var(--primary-color); }
    
    .tab-content { display: none; padding: 36px; }
    .tab-content.active { display: block; }

    .form-group { margin-bottom: 22px; }
    label { display: block; font-weight: 700; margin-bottom: 8px; font-size: 1rem; color: var(--text-main); }
    input, select, textarea { width: 100%; padding: 14px 16px; border: 1px solid var(--border-color); border-radius: 10px; font-size: 1rem; outline: none; background-color: white; }

    .select-row { display: flex; gap: 12px; }
    .select-row select { flex: 1; }

    .weather-card-box { background: linear-gradient(135deg, #4b6282 0%, #5a7395 50%, #7287a5 100%); border-radius: 16px; padding: 24px; color: white; margin-bottom: 24px; }
    .weather-card-box label { color: #f1f5f9; }
    
    .weather-fetch-btn { width: 100%; padding: 12px; margin-top: 10px; background-color: rgba(255, 255, 255, 0.18); color: #ffffff; border: 1px solid rgba(255, 255, 255, 0.35); border-radius: 10px; font-weight: 700; cursor: pointer; }

    .btn-group { display: flex; gap: 12px; }

    button.submit-btn { flex: 2; padding: 16px; background-color: var(--primary-color); color: white; border: none; border-radius: 12px; font-size: 1.1rem; font-weight: 700; cursor: pointer; }
    button.re-recommend-btn { flex: 1; padding: 16px; background-color: #059669; color: white; border: none; border-radius: 12px; font-size: 1rem; font-weight: 700; cursor: pointer; display: none; }
    button.re-recommend-btn:hover { background-color: #047857; }

    .result-box { margin-top: 28px; padding: 24px; background-color: #f1f5f9; border-radius: 12px; border-left: 6px solid var(--primary-color); white-space: pre-wrap; line-height: 1.7; display: none; }
    
    .map-container { margin-top: 24px; display: none; border-radius: 16px; overflow: hidden; border: 1px solid var(--border-color); }
    .map-header { background: #334155; color: white; padding: 14px 20px; font-size: 0.95rem; font-weight: 700; display: flex; justify-content: space-between; align-items: center; }
    #mapView { width: 100%; height: 450px; background-color: #f1f5f9; }

    .loading { text-align: center; color: var(--primary-color); font-weight: 700; font-size: 1.1rem; margin-top: 24px; display: none; }

    /* 지도 범례 */
    .map-legend { display: flex; gap: 16px; background: #1e293b; color: #f8fafc; padding: 8px 20px; font-size: 0.85rem; }
    .legend-item { display: flex; align-items: center; gap: 6px; }
    .legend-color { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
  </style>
</head>
<body>

  <header>
    <h1>🏃‍♂️ RunningMate</h1>
    <p>AI 기반 맞춤형 날씨 경로 추천 및 실시간 피드백</p>
  </header>

  <main class="container">
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab(event, 'tab-weather')">🌤️ 날씨 & 경로 추천</button>
      <button class="tab-btn" onclick="switchTab(event, 'tab-board')">💬 자유 게시판</button>
    </div>

    <div id="tab-weather" class="tab-content active">
      <div class="weather-card-box">
        <div class="form-group">
          <label>지역 선택</label>
          <div class="select-row">
            <select id="regionDo" onchange="updateCitySelect()">
              <option value="">도/특별시 선택</option>
              <option value="경기도">경기도</option>
              <option value="서울특별시">서울특별시</option>
            </select>
            <select id="regionCity"><option value="">시/구 선택</option></select>
          </div>
          <button type="button" class="weather-fetch-btn" onclick="fetchCurrentWeather()">🌤️ 선택 지역 실시간 날씨 불러오기</button>
        </div>

        <div class="form-group" style="margin-bottom:0;">
          <label for="weatherStatus">조회된 날씨 정보</label>
          <input type="text" id="weatherStatus" readonly placeholder="날씨를 불러와주세요">
        </div>
      </div>

      <div class="form-group">
        <label for="detailLocation">상세 위치 입력 (출발지)</label>
        <input type="text" id="detailLocation" placeholder="예: 보람마을 아주아파트, 한양대 에리카 등">
      </div>

      <div class="btn-group">
        <button type="button" class="submit-btn" onclick="requestAI('weather', false)">맞춤 코스 추천받기</button>
        <button type="button" id="reRecommendBtn" class="re-recommend-btn" onclick="requestAI('weather', true)">🔄 다른 장소 추천받기</button>
      </div>
    </div>

    <div id="loading" class="loading">🏃 AI가 최적의 러닝 코스를 분석하고 있습니다...</div>

    <div id="mapContainer" class="map-container">
      <div class="map-header">
        <span id="mapTitle">📍 RunningMate 러닝 코스 지도</span>
        <span style="font-size:0.8rem; color:#cbd5e1;">Kakao Map API</span>
      </div>
      <div class="map-legend">
        <div class="legend-item"><span class="legend-color" style="background:#3b82f6;"></span> 출발지</div>
        <div class="legend-item"><span class="legend-color" style="background:#ef4444;"></span> 러닝 추천 장소</div>
        <div class="legend-item"><span style="color:#94a3b8;">---</span> 이동 경로(점선)</div>
        <div class="legend-item"><span style="color:#ef4444;">━━</span> 러닝 코스 루프(실선)</div>
      </div>
      <div id="mapView"></div>
    </div>

    <div id="result" class="result-box"></div>
  </main>

  <script>
    let kakaoMap = null;
    let mapMarkers = [];
    let mapPolylines = [];
    let excludePlaces = []; // 이전에 추천받은 장소들을 모아두는 목록

    function clearMap() {
      mapMarkers.forEach(m => m.setMap(null));
      mapPolylines.forEach(p => p.setMap(null));
      mapMarkers = [];
      mapPolylines = [];
    }

    async function requestAI(type, isReRecommend = false) {
      const loading = document.getElementById('loading');
      const resultBox = document.getElementById('result');
      const reBtn = document.getElementById('reRecommendBtn');

      if (!isReRecommend) {
        excludePlaces = []; // 처음 '맞춤 코스 추천받기'를 누른 경우 제외 목록 초기화
      }

      const doVal = document.getElementById('regionDo').value;
      const cityVal = document.getElementById('regionCity').value;
      const detailLocation = document.getElementById('detailLocation').value;

      if (!doVal || !cityVal) return alert('지역을 선택해주세요!');

      const payload = {
        baseRegion: `${doVal} ${cityVal}`,
        detailLocation: detailLocation.trim(),
        excludeList: excludePlaces // 백엔드(generate.js)로 이전 추천 장소 목록 전달
      };

      loading.style.display = 'block';
      resultBox.style.display = 'none';

      try {
        const response = await fetch('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ type, payload })
        });

        const data = await response.json();

        if (response.ok) {
          resultBox.innerText = data.result;
          resultBox.style.display = 'block';
          reBtn.style.display = 'inline-block'; // '다른 장소 추천받기' 버튼 노출

          // AI가 파싱해준 장소명이 있는 경우
          if (data.spotName) {
            excludePlaces.push(data.spotName); // 제외 목록에 등록
            const startQuery = payload.detailLocation ? `${payload.baseRegion} ${payload.detailLocation}` : '';
            renderDetailedRunningMap(startQuery, data.spotName);
          }
        }
      } catch (err) {
        alert('추천을 불러오는 중 오류 발생: ' + err.message);
      } finally {
        loading.style.display = 'none';
      }
    }

    // 🗺️ 지도 시각화 (출발지 점선 + 러닝코스 루프 실선)
    function renderDetailedRunningMap(startQuery, spotName) {
      const mapContainer = document.getElementById('mapContainer');
      const mapView = document.getElementById('mapView');
      mapContainer.style.display = 'block';

      if (!window.kakao || !window.kakao.maps) return;
      const ps = new kakao.maps.services.Places();

      if (!kakaoMap) {
        kakaoMap = new kakao.maps.Map(mapView, {
          center: new kakao.maps.LatLng(37.5665, 126.9780),
          level: 4
        });
      }

      clearMap();
      const bounds = new kakao.maps.LatLngBounds();

      // 빨간색 마커 이미지 (러닝 추천 장소용)
      const redMarkerSrc = 'https://t1.daumcdn.net/localimg/localimages/07/mapapidoc/marker_red.png'; 
      const markerSize = new kakao.maps.Size(31, 35);
      const redMarkerImage = new kakao.maps.MarkerImage(redMarkerSrc, markerSize);

      // 1. 러닝 추천 장소 키워드 검색
      ps.keywordSearch(spotName, (spotData, spotStatus) => {
        if (spotStatus === kakao.maps.services.Status.OK) {
          const spotLat = parseFloat(spotData[0].y);
          const spotLng = parseFloat(spotData[0].x);
          const spotPos = new kakao.maps.LatLng(spotLat, spotLng);

          // 러닝 장소 마커 (빨간색)
          const spotMarker = new kakao.maps.Marker({
            position: spotPos,
            map: kakaoMap,
            image: redMarkerImage,
            title: spotName
          });
          mapMarkers.push(spotMarker);
          bounds.extend(spotPos);

          // 🏃‍♂️ 추천 장소 내부 러닝 루프 코스 생성 (빨간색 실선)
          const loopPath = generateRunningLoop(spotLat, spotLng, 0.0025);
          const runningPolyline = new kakao.maps.Polyline({
            path: loopPath,
            strokeWeight: 6,
            strokeColor: '#EF4444',
            strokeOpacity: 0.9,
            strokeStyle: 'solid'
          });
          runningPolyline.setMap(kakaoMap);
          mapPolylines.push(runningPolyline);

          // 2. 출발지가 있는 경우 이동 경로(점선) 연결
          if (startQuery) {
            ps.keywordSearch(startQuery, (startData, startStatus) => {
              if (startStatus === kakao.maps.services.Status.OK) {
                const startPos = new kakao.maps.LatLng(startData[0].y, startData[0].x);

                // 출발지 마커 (기본 파란색)
                const startMarker = new kakao.maps.Marker({
                  position: startPos,
                  map: kakaoMap,
                  title: '출발지'
                });
                mapMarkers.push(startMarker);
                bounds.extend(startPos);

                // 이동 경로 (회색 점선)
                const accessPolyline = new kakao.maps.Polyline({
                  path: [startPos, spotPos],
                  strokeWeight: 4,
                  strokeColor: '#64748B',
                  strokeOpacity: 0.7,
                  strokeStyle: 'dash'
                });
                accessPolyline.setMap(kakaoMap);
                mapPolylines.push(accessPolyline);

                kakaoMap.setBounds(bounds);
              } else {
                kakaoMap.setCenter(spotPos);
              }
            });
          } else {
            kakaoMap.setCenter(spotPos);
            kakaoMap.setLevel(4);
          }
        }
      });
    }

    // 장소 기준 타원형 러닝 루프 좌표 생성 함수
    function generateRunningLoop(lat, lng, radius) {
      const path = [];
      const numPoints = 8;
      for (let i = 0; i < numPoints; i++) {
        const angle = (i / numPoints) * (2 * Math.PI);
        const dLat = radius * Math.cos(angle);
        const dLng = (radius * 1.3) * Math.sin(angle);
        path.push(new kakao.maps.LatLng(lat + dLat, lng + dLng));
      }
      path.push(path[0]);
      return path;
    }
  </script>
</body>
</html>
